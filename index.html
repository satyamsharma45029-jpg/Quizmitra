<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QuizMitra - GK Quiz</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7ff;
  color: #172554;
  transition: 0.3s;
}

header {
  background: white;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 10px #ddd;
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #4f46e5;
}

.badge {
  background: #eef2ff;
  color: #4f46e5;
  padding: 9px 12px;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
}

.hero {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: white;
  padding: 35px 20px;
  text-align: center;
}

.hero h1 {
  font-size: 32px;
  margin-bottom: 15px;
}

.hero p {
  margin-bottom: 10px;
}

.categories,
.difficulty-box {
  margin: 25px 15px;
  text-align: center;
}

.categories h2,
.difficulty-box h2 {
  margin-bottom: 15px;
}

.categories button,
.difficulty-box button {
  display: block;
  width: 100%;
  max-width: 350px;
  margin: 10px auto;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.difficulty-box button {
  background: #7c3aed;
}

.quiz-box {
  max-width: 600px;
  margin: 25px auto;
  padding: 20px;
}

.progress-text {
  font-weight: bold;
}

.progress-container {
  width: 100%;
  height: 10px;
  background: #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
  margin: 15px 0 20px;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #2563eb, #7c3aed);
  transition: width 0.3s;
}

.question-card,
.result {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #e1e1e1;
}

.timer {
  background: #fff7ed;
  color: #ea580c;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  margin-bottom: 20px;
}

.question-number {
  display: inline-block;
  background: #dbeafe;
  color: #1d4ed8;
  padding: 8px 14px;
  border-radius: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

.question {
  font-size: 21px;
  line-height: 1.4;
  margin-bottom: 25px;
}

.options {
  display: grid;
  gap: 12px;
}

.option {
  padding: 16px;
  border: 2px solid #e5e7eb;
  background: white;
  border-radius: 12px;
  text-align: left;
  font-size: 16px;
  cursor: pointer;
  color: #172554;
}

.option.correct {
  background: #dcfce7;
  color: #166534;
  border-color: #22c55e;
}

.option.wrong {
  background: #fee2e2;
  color: #991b1b;
  border-color: #ef4444;
}

.next-btn,
.restart,
.home-btn {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.next-btn,
.restart {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
}

.home-btn {
  background: #64748b;
}

.next-btn:disabled {
  opacity: 0.5;
}

.feedback {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
}

.feedback.correct {
  background: #dcfce7;
  color: #166534;
}

.feedback.wrong {
  background: #fee2e2;
  color: #991b1b;
}

.result {
  text-align: center;
}

.result h2 {
  margin-bottom: 15px;
}

.score {
  font-size: 50px;
  color: #4f46e5;
  font-weight: bold;
  margin: 20px;
}

#percentage {
  font-size: 22px;
  font-weight: bold;
  color: #2563eb;
}

#correct-count {
  color: #16a34a;
  font-weight: bold;
  margin-top: 10px;
}

#wrong-count {
  color: #dc2626;
  font-weight: bold;
  margin-top: 8px;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  padding: 25px;
  color: #64748b;
}

body.dark {
  background: #0f172a;
  color: #f8fafc;
}

body.dark header,
body.dark .question-card,
body.dark .result {
  background: #1e293b;
  box-shadow: none;
}

body.dark .option {
  background: #334155;
  color: white;
  border-color: #475569;
}

body.dark .question-number {
  background: #1e3a8a;
  color: #bfdbfe;
}

body.dark .hero {
  background: linear-gradient(135deg, #312e81, #581c87);
}
</style>
</head>

<body>

<header>
  <div class="logo">QuizMitra</div>

  <button class="badge" onclick="toggleDarkMode()">
    🌙 Dark Mode
  </button>
</header>

<div class="hero">
  <h1>QuizMitra 🧠</h1>
  <p>Learn • Play • Compete</p>
  <p>Challenge yourself with fun quizzes!</p>
</div>

<div class="categories">
  <h2>Choose Quiz Category</h2>

  <button onclick="startCategory('gk')">
    🧠 General Knowledge
  </button>

  <button onclick="startCategory('science')">
    🔬 Science
  </button>

  <button onclick="startCategory('history')">
    📚 History
  </button>

  <button onclick="startCategory('sports')">
    ⚽ Sports
  </button>
</div>

<div class="difficulty-box">
  <h2>Choose Difficulty</h2>

  <button onclick="setDifficulty('easy')">
    🟢 Easy
  </button>

  <button onclick="setDifficulty('medium')">
    🟡 Medium
  </button>

  <button onclick="setDifficulty('hard')">
    🔴 Hard
  </button>
</div>

<div class="quiz-box">

  <div id="quiz-container">

    <b id="progress-text">Question 1</b>

    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="question-card">

      <div class="timer">
        ⏱️ Time Left: <span id="timer">20</span>s
      </div>

      <div class="question-number" id="question-number">
        Question 1
      </div>

      <div class="question" id="question">
        Loading question...
      </div>

      <div class="options" id="options"></div>

      <div id="feedback"></div>

      <button class="next-btn" id="next-btn" disabled>
        Next Question →
      </button>

    </div>
  </div>

  <div class="result hidden" id="result">

    <h2>🎉 Quiz Completed!</h2>

    <p>Your Score</p>

    <div class="score" id="score">0 / 2</div>

    <p id="percentage"></p>
    <p id="message"></p>
    <p id="correct-count"></p>
    <p id="wrong-count"></p>

    <button class="restart" onclick="restartQuiz()">
      🔄 Play Again
    </button>
  </div>

  <button class="home-btn" onclick="goHome()">
    🏠 Home
  </button>

</div>

<footer>
  <p>© 2026 QuizMitra | Learn • Play • Compete 🧠</p>
</footer>

<script>
const categoryQuestions = {
  gk: {
    easy: [
      {
        question: "भारत की राजधानी क्या है?",
        options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"],
        answer: 1
      },
      {
        question: "एक सप्ताह में कितने दिन होते हैं?",
        options: ["5", "6", "7", "8"],
        answer: 2
      }
    ],

    medium: [
      {
        question: "भारत का संविधान कब लागू हुआ?",
        options: ["15 अगस्त 1947", "26 जनवरी 1950", "2 अक्टूबर 1950", "14 नवंबर 1949"],
        answer: 1
      },
      {
        question: "भारत का राष्ट्रीय गीत कौन-सा है?",
        options: ["जन गण मन", "वंदे मातरम्", "सारे जहाँ से अच्छा", "ऐ मेरे वतन"],
        answer: 1
      }
    ],

    hard: [
      {
        question: "भारतीय संविधान की प्रारूप समिति के अध्यक्ष कौन थे?",
        options: ["जवाहरलाल नेहरू", "डॉ. बी. आर. अंबेडकर", "सरदार पटेल", "राजेंद्र प्रसाद"],
        answer: 1
      },
      {
        question: "भारत में पहली जनगणना किस वर्ष हुई थी?",
        options: ["1872", "1881", "1901", "1857"],
        answer: 0
      }
    ]
  },

  science: {
    easy: [
      {
        question: "पानी का रासायनिक सूत्र क्या है?",
        options: ["CO2", "O2", "H2O", "N2"],
        answer: 2
      },
      {
        question: "मनुष्य साँस लेने के लिए कौन-सी गैस उपयोग करता है?",
        options: ["नाइट्रोजन", "ऑक्सीजन", "हाइड्रोजन", "हीलियम"],
        answer: 1
      }
    ],

    medium: [
      {
        question: "प्रकाश संश्लेषण में पौधे कौन-सी गैस लेते हैं?",
        options: ["ऑक्सीजन", "नाइट्रोजन", "कार्बन डाइऑक्साइड", "हाइड्रोजन"],
        answer: 2
      },
      {
        question: "मानव शरीर में रक्त को पंप कौन करता है?",
        options: ["फेफड़े", "हृदय", "मस्तिष्क", "गुर्दे"],
        answer: 1
      }
    ],

    hard: [
      {
        question: "विद्युत प्रतिरोध की SI इकाई क्या है?",
        options: ["वोल्ट", "एम्पियर", "ओम", "वाट"],
        answer: 2
      },
      {
        question: "DNA का पूरा नाम क्या है?",
        options: [
          "Deoxyribonucleic Acid",
          "Dynamic Nuclear Acid",
          "Double Nitrogen Acid",
          "Deoxygenated Nuclear Acid"
        ],
        answer: 0
      }
    ]
  },

  history: {
    easy: [
      {
        question: "भारत को स्वतंत्रता कब मिली?",
        options: ["1945", "1947", "1950", "1952"],
        answer: 1
      },
      {
        question: "भारत के पहले प्रधानमंत्री कौन थे?",
        options: ["महात्मा गांधी", "जवाहरलाल नेहरू", "सरदार पटेल", "राजेंद्र प्रसाद"],
        answer: 1
      }
    ],

    medium: [
      {
        question: "जलियांवाला बाग हत्याकांड किस वर्ष हुआ?",
        options: ["1919", "1920", "1930", "1942"],
        answer: 0
      },
      {
        question: "भारत छोड़ो आंदोलन किस वर्ष शुरू हुआ?",
        options: ["1930", "1935", "1942", "1947"],
        answer: 2
      }
    ],

    hard: [
      {
        question: "पानीपत का प्रथम युद्ध किस वर्ष हुआ?",
        options: ["1526", "1556", "1761", "1857"],
        answer: 0
      },
      {
        question: "मौर्य साम्राज्य के संस्थापक कौन थे?",
        options: ["अशोक", "चंद्रगुप्त मौर्य", "बिंदुसार", "हर्षवर्धन"],
        answer: 1
      }
    ]
  },

  sports: {
    easy: [
      {
        question: "क्रिकेट की एक टीम में कितने खिलाड़ी होते हैं?",
        options: ["9", "10", "11", "12"],
        answer: 2
      },
      {
        question: "फुटबॉल में एक टीम में मैदान पर कितने खिलाड़ी होते हैं?",
        options: ["9", "10", "11", "12"],
        answer: 2
      }
    ],

    medium: [
      {
        question: "ओलंपिक खेल कितने वर्षों के अंतराल पर होते हैं?",
        options: ["2", "3", "4", "5"],
        answer: 2
      },
      {
        question: "क्रिकेट में LBW का पूरा नाम क्या है?",
        options: [
          "Leg Before Wicket",
          "Long Bat Winner",
          "Left Ball Wide",
          "Leg Bat Wide"
        ],
        answer: 0
      }
    ],

    hard: [
      {
        question: "फुटबॉल में FIFA का पूरा नाम क्या है?",
        options: [
          "Federation International Football Association",
          "Fédération Internationale de Football Association",
          "Football International Federation Association",
          "Federation Indian Football Association"
        ],
        answer: 1
      },
      {
        question: "क्रिकेट में एक ओवर में सामान्यतः कितनी गेंदें होती हैं?",
        options: ["4", "5", "6", "8"],
        answer: 2
      }
    ]
  }
};

let selectedCategory = "gk";
let selectedDifficulty = "easy";
let questions = categoryQuestions.gk.easy;

let currentQuestion = 0;
let score = 0;
let selected = false;
let timeLeft = 20;
let timerInterval;

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("next-btn");
const progressText = document.getElementById("progress-text");
const progressBar = document.getElementById("progress-bar");
const questionNumber = document.getElementById("question-number");
const quizContainer = document.getElementById("quiz-container");
const result = document.getElementById("result");
const feedback = document.getElementById("feedback");

function toggleDarkMode() {
  document.body.classList.toggle("dark");

  if (document.body.classList.contains("dark")) {
    localStorage.setItem("quizmitra-theme", "dark");
  } else {
    localStorage.setItem("quizmitra-theme", "light");
  }
}

if (localStorage.getItem("quizmitra-theme") === "dark") {
  document.body.classList.add("dark");
}

function setDifficulty(level) {
  selectedDifficulty = level;

  if (level === "easy") {
    timeLeft = 20;
  } else if (level === "medium") {
    timeLeft = 15;
  } else {
    timeLeft = 10;
  }

  alert("Difficulty selected: " + level.toUpperCase());
}

function startTimer() {
  clearInterval(timerInterval);

  if (selectedDifficulty === "easy") {
    timeLeft = 20;
  } else if (selectedDifficulty === "medium") {
    timeLeft = 15;
  } else {
    timeLeft = 10;
  }

  document.getElementById("timer").textContent = timeLeft;

  timerInterval = setInterval(function() {
    timeLeft--;

    document.getElementById("timer").textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);

      if (!selected) {
        selected = true;
        nextBtn.disabled = false;

        document.querySelectorAll(".option").forEach(function(btn) {
          btn.disabled = true;
        });

        feedback.textContent = "⏰ Time Over!";
        feedback.className = "feedback wrong";
      }
    }
  }, 1000);
}

function loadQuestion() {
  clearInterval(timerInterval);

  selected = false;
  nextBtn.disabled = true;

  feedback.textContent = "";
  feedback.className = "";

  const q = questions[currentQuestion];

  questionEl.textContent = q.question;

  questionNumber.textContent =
    "Question " + (currentQuestion + 1);

  progressText.textContent =
    "Question " +
    (currentQuestion + 1) +
    " of " +
    questions.length;

  progressBar.style.width =
    ((currentQuestion + 1) / questions.length * 100) + "%";

  optionsEl.innerHTML = "";

  q.options.forEach(function(option, index) {
    const button = document.createElement("button");

    button.className = "option";

    button.textContent =
      String.fromCharCode(65 + index) + ". " + option;

    button.onclick = function() {
      selectAnswer(index, button);
    };

    optionsEl.appendChild(button);
  });

  startTimer();
}

function selectAnswer(index, button) {
  if (selected) return;

  selected = true;
  clearInterval(timerInterval);

  const correctAnswer = questions[currentQuestion].answer;
  const allOptions = document.querySelectorAll(".option");

  allOptions.forEach(function(btn, i) {
    btn.disabled = true;

    if (i === correctAnswer) {
      btn.classList.add("correct");
    }
  });

  if (index === correctAnswer) {
    score++;
    button.classList.add("correct");

    feedback.textContent = "✅ Correct Answer!";
    feedback.className = "feedback correct";
  } else {
    button.classList.add("wrong");

    feedback.textContent =
      "❌ Wrong Answer! Correct: " +
      questions[currentQuestion].options[correctAnswer];

    feedback.className = "feedback wrong";
  }

  nextBtn.disabled = false;
}

nextBtn.onclick = function() {
  clearInterval(timerInterval);

  currentQuestion++;

  if (currentQuestion < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
};

function showResult() {
  clearInterval(timerInterval);

  quizContainer.classList.add("hidden");
  result.classList.remove("hidden");

  document.getElementById("score").textContent =
    score + " / " + questions.length;

  const percentage =
    Math.round((score / questions.length) * 100);

  document.getElementById("percentage").textContent =
    "Percentage: " + percentage + "%";

  document.getElementById("correct-count").textContent =
    "Correct Answers: " + score;

  document.getElementById("wrong-count").textContent =
    "Wrong Answers: " + (questions.length - score);

  let message = "";

  if (score >= questions.length * 0.8) {
    message = "🏆 Excellent! You are a Quiz Champion!";
  } else if (score >= questions.length * 0.5) {
    message = "👏 Good job! Keep learning!";
  } else {
    message = "💪 Keep practicing! You can do better!";
  }

  document.getElementById("message").textContent = message;
}

function restartQuiz() {
  clearInterval(timerInterval);

  currentQuestion = 0;
  score = 0;
  selected = false;

  questions = categoryQuestions[selectedCategory][selectedDifficulty];

  quizContainer.classList.remove("hidden");
  result.classList.add("hidden");

  loadQuestion();
}

function goHome() {
  clearInterval(timerInterval);

  currentQuestion = 0;
  score = 0;
  selected = false;

  quizContainer.classList.remove("hidden");
  result.classList.add("hidden");

  questions = categoryQuestions[selectedCategory][selectedDifficulty];

  loadQuestion();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function startCategory(category) {
  clearInterval(timerInterval);

  selectedCategory = category;
  questions = categoryQuestions[selectedCategory][selectedDifficulty];

  currentQuestion = 0;
  score = 0;
  selected = false;

  quizContainer.classList.remove("hidden");
  result.classList.add("hidden");

  loadQuestion();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

loadQuestion();
</script>

</body>
</html>
